<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旗山孔廟｜實境解謎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        
        body { font-family: 'Noto Serif TC', serif; background-color: #F4EAD5; color: #3E2723; overflow-x: hidden; }
        
        /* 裝飾動畫 */
        .decoration-img { mix-blend-mode: multiply; animation: float 6s ease-in-out infinite; }
        .decoration-img-delayed { mix-blend-mode: multiply; animation: float 6s ease-in-out infinite; animation-delay: 3s; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

        /* 提示框與轉場動畫 */
        .toast-enter { transform: translateY(-100%); opacity: 0; transition: all 0.3s ease-out; }
        .toast-show { transform: translateY(0); opacity: 1; }
        .scroll-reveal { opacity: 0; transform: scale(0.95); transition: all 0.8s ease-out; }
        .scroll-reveal.active { opacity: 1; transform: scale(1); }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- 背景裝飾 -->
    <div class="fixed left-0 top-1/4 -translate-y-1/2 opacity-15 md:opacity-100 md:left-10 pointer-events-none">
        <img src="boy.jpg" alt="古典裝飾" class="w-40 md:w-56 lg:w-72 decoration-img" onerror="this.style.display='none'">
    </div>
    <div class="fixed right-0 top-2/3 -translate-y-1/2 opacity-15 md:opacity-100 md:right-10 pointer-events-none">
        <img src="temple.jpg" alt="古典裝飾" class="w-40 md:w-56 lg:w-72 decoration-img-delayed" onerror="this.style.display='none'">
    </div>

    <!-- 頂部提示訊息 -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg text-white font-bold text-center w-11/12 max-w-sm toast-enter hidden"></div>

    <!-- 主遊戲容器 -->
    <div id="game-container" class="relative z-10 w-full max-w-md bg-[#FAF3E0] rounded-xl shadow-2xl overflow-hidden border-2 border-[#8B2500]">
        <div class="h-3 w-full bg-[#8B2500]"></div>
        <div class="p-6 md:p-8">
            
            <!-- 標題 -->
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto mb-2 border-2 border-[#8B2500] rounded-full flex items-center justify-center text-3xl text-[#8B2500] font-black shadow-inner">孔</div>
                <h1 class="text-2xl font-black text-[#8B2500] tracking-widest">旗山孔廟</h1>
                <p class="text-xs font-bold text-gray-600 tracking-widest mt-1">新科弟子試煉</p>
            </div>

            <!-- 引言 -->
            <div id="intro-section" class="mb-6 text-sm text-gray-700 leading-relaxed bg-[#F4EAD5] p-4 rounded border border-[#D7CCC8]">
                <strong>【身分賦予】</strong><br>
                老夫子幻影浮現：「年輕人，孔廟的智慧藏在團隊、自然與幾何之中。今日的試煉需要你們分工合作，準備好迎接挑戰了嗎？」
            </div>

            <!-- 解謎區塊 (動態渲染內容) -->
            <div id="puzzle-section">
                <div class="flex justify-between text-xs font-bold text-[#8B2500] mb-2 tracking-widest">
                    <span id="level-indicator">卷一 / 共五卷</span>
                    <span id="mistake-counter">失誤：0</span>
                </div>
                
                <div class="bg-white rounded-lg p-5 shadow-sm border border-[#E7DCC8] mb-4" id="level-content">
                    <!-- JS 會將關卡內容注入這裡 -->
                </div>
            </div>

            <!-- 結局區塊 -->
            <div id="ending-section" class="hidden scroll-reveal">
                <div class="bg-white rounded-lg p-6 shadow-sm border-2 border-[#8B2500] relative text-center">
                    <div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-[#8B2500] text-white px-4 py-1 rounded text-sm tracking-widest font-bold">試煉完成</div>
                    <h2 class="text-3xl font-black text-[#8B2500] mt-4 mb-2" id="final-rank">狀元及第</h2>
                    <p class="text-gray-500 font-bold mb-4" id="final-score">最終得分：100 分</p>
                    <div class="text-sm text-gray-700 leading-relaxed border-t border-dashed border-gray-300 pt-4 text-left">
                        老夫子欣慰地微笑：「善哉！你們學會了分工合作、細心觀察，並用天地人陣法看破了大地密碼。你們已領悟儒門大道，這份智慧將伴隨你們一生！」
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full mt-6 border-2 border-[#8B2500] text-[#8B2500] font-bold py-2 px-4 rounded tracking-widest">再玩一次</button>
            </div>
        </div>
    </div>

    <!-- Web AR 相機視窗 -->
    <div id="ar-modal" class="fixed inset-0 z-50 bg-black hidden flex flex-col">
        <div id="ar-hint" class="w-full bg-black/70 text-white text-center py-3 px-4 z-20 text-sm font-bold text-yellow-400"></div>
        <div class="relative w-full flex-1 overflow-hidden">
            <video id="ar-video" class="w-full h-full object-cover" autoplay playsinline muted></video>
            
            <!-- AR 大地密碼 (781) -->
            <svg id="svg-landscape" class="hidden absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 1000 1000" preserveAspectRatio="none">
                <rect x="420" y="380" width="160" height="90" fill="none" stroke="#FFEB3B" stroke-width="3" stroke-dasharray="8 8"/>
                <path d="M 230 470 L 380 495 L 290 680" fill="none" stroke="#FF1744" stroke-width="9"/>
                <line x1="380" y1="565" x2="605" y2="560" stroke="#FF1744" stroke-width="9"/>
                <line x1="300" y1="675" x2="625" y2="655" stroke="#FF1744" stroke-width="9"/>
                <path d="M 700 515 L 775 695" fill="none" stroke="#FF1744" stroke-width="9"/>
            </svg>

            <!-- AR 人體陣法 (雙人框) -->
            <svg id="svg-human" class="hidden absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
                <!-- 左邊小人 -->
                <g transform="translate(150, 300)" stroke="#00E676" stroke-width="8" stroke-dasharray="10 10" fill="none">
                    <circle cx="150" cy="80" r="50" />
                    <line x1="150" y1="130" x2="150" y2="400" />
                    <line x1="150" y1="180" x2="0" y2="80" /> <!-- 舉左手 -->
                    <line x1="150" y1="180" x2="250" y2="300" />
                    <line x1="150" y1="400" x2="50" y2="600" />
                    <line x1="150" y1="400" x2="250" y2="600" />
                    <text x="150" y="700" fill="#00E676" font-size="40" stroke="none" text-anchor="middle">隊友一入陣</text>
                </g>
                <!-- 右邊小人 -->
                <g transform="translate(550, 300)" stroke="#29B6F6" stroke-width="8" stroke-dasharray="10 10" fill="none">
                    <circle cx="150" cy="80" r="50" />
                    <line x1="150" y1="130" x2="150" y2="400" />
                    <line x1="150" y1="180" x2="50" y2="300" />
                    <line x1="150" y1="180" x2="300" y2="80" /> <!-- 舉右手 -->
                    <line x1="150" y1="400" x2="50" y2="600" />
                    <line x1="150" y1="400" x2="250" y2="600" />
                    <text x="150" y="700" fill="#29B6F6" font-size="40" stroke="none" text-anchor="middle">隊友二入陣</text>
                </g>
            </svg>
        </div>
        <div class="w-full bg-black/80 p-4 flex justify-center z-20">
            <button onclick="closeARCamera()" class="bg-[#8B2500] text-white px-8 py-3 rounded-full font-bold shadow-lg">完成透視，返回作答</button>
        </div>
    </div>

    <script>
        // 五大關卡設定
        const levels = [
            {
                type: 'standard',
                title: "黌門的起點",
                desc: "求學必須從正門而入。這座孔廟最外側有兩座宏偉的牌坊。",
                question: "請找找看，這座代表古代學校大門的牌坊上刻著哪兩個字？（提示：音同紅門）",
                answer: "黌門"
            },
            {
                type: 'coop',
                title: "分頭行動的默契",
                desc: "孔子曰：三人行必有我師。請小組分工合作！",
                roles: {
                    east: "【東廡弟子】請前往東側廂房找『先賢左子丘明神位』。<br>👉 請大聲告訴夥伴：牌位最下方木雕是什麼神獸？",
                    west: "【西廡弟子】請前往西側廂房找牆上『尊道』匾額。<br>👉 將夥伴傳遞來的神獸名稱，加上匾額的第二個字，就是密碼！"
                },
                question: "請西廡弟子負責輸入兩人合作得出的兩字密碼：",
                answer: "龍道"
            },
            {
                type: 'photo',
                title: "四靈的賜福",
                desc: "萬物皆有靈。老夫子需要你記錄下神獸的色彩。",
                question: "請在廂房內尋找任何一面刻有『龍』的先賢/先儒牌位，並拍下它的照片。",
                questionAfter: "做得好！觀察你拍下的照片，牌位中間寫著古人名字的底色，是什麼顏色？",
                answer: ["紅", "紅色"]
            },
            {
                type: 'ar_human',
                title: "人體三才陣",
                desc: "天地人和方能成事。老夫子要考驗你們的團隊行動力。",
                question: "隊長請點擊下方開啟陣法，指揮兩位隊友站進虛線框。完成後請隊友齊聲大喊『天地人』，並由隊長輸入這三個字！",
                answer: "天地人",
                arHint: "請指揮隊友退後，完美塞進人形虛線框中！"
            },
            {
                type: 'ar_landscape',
                title: "大地的幾何密碼",
                desc: "站在大成殿外的中軸線台階最高處，俯瞰庭院。孔廟的浩瀚蘊藏幾何規律。",
                question: "開啟透視鏡，將紅線與前方的大門步道對齊，大地拼出了哪三位數字密碼？",
                answer: "781",
                arHint: "對準遠處牌坊，尋找大地與紅線交織出的數字！"
            }
        ];

        let currentLevel = 0;
        let wrongAttempts = 0;
        let cameraStream = null;

        function loadLevel() {
            const level = levels[currentLevel];
            document.getElementById('level-indicator').textContent = `卷${["一", "二", "三", "四", "五"][currentLevel]} / 共五卷`;
            const content = document.getElementById('level-content');
            let html = `<h2 class="text-xl font-bold mb-3 text-[#5D4037] border-b-2 border-[#8B2500] pb-2 inline-block">${level.title}</h2>
                        <p class="text-gray-700 mb-4 text-sm leading-relaxed">${level.desc}</p>`;

            // 依據關卡類型渲染不同的 UI
            if (level.type === 'coop') {
                html += `
                    <div class="flex gap-2 mb-4">
                        <button onclick="selectRole('east')" class="flex-1 border-2 border-[#8B2500] text-[#8B2500] font-bold py-2 rounded">我是東廡弟子</button>
                        <button onclick="selectRole('west')" class="flex-1 bg-[#8B2500] text-white font-bold py-2 rounded">我是西廡弟子</button>
                    </div>
                    <div id="role-info" class="hidden mb-4 p-3 bg-orange-50 border border-orange-200 rounded text-sm font-bold text-[#8B2500]"></div>
                    <div id="input-area" class="hidden fade-in">
                        <p class="font-bold text-[#8B2500] mb-2">${level.question}</p>
                        ${getInputHTML()}
                    </div>`;
            } else if (level.type === 'photo') {
                html += `
                    <p class="font-bold text-[#8B2500] mb-4">${level.question}</p>
                    <label class="block w-full bg-[#1B5E20] text-white text-center py-4 rounded-lg cursor-pointer shadow-md font-bold mb-4">
                        📷 點此開啟相機拍照
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event)">
                    </label>
                    <div id="photo-preview-box" class="hidden fade-in">
                        <img id="photo-preview" class="w-full h-48 object-cover rounded border-2 border-gray-300 mb-4">
                        <p class="font-bold text-[#8B2500] mb-2">${level.questionAfter}</p>
                        ${getInputHTML()}
                    </div>`;
            } else if (level.type.startsWith('ar_')) {
                html += `
                    <p class="font-bold text-[#8B2500] mb-4">${level.question}</p>
                    <button onclick="openARCamera('${level.type}', '${level.arHint}')" class="w-full bg-[#1B5E20] text-white font-bold py-3 px-4 rounded-lg shadow-md mb-4 flex items-center justify-center gap-2">
                        <span class="text-xl">📱</span> 開啟透視鏡陣法
                    </button>
                    ${getInputHTML()}
                `;
            } else {
                html += `
                    <p class="font-bold text-[#8B2500] mb-4">${level.question}</p>
                    ${getInputHTML()}
                `;
            }
            content.innerHTML = html;
        }

        // 共用的輸入框與按鈕 HTML
        function getInputHTML() {
            return `
                <input type="text" id="answer-input" placeholder="請輸入答案..." class="w-full px-4 py-3 rounded bg-gray-50 border border-gray-300 focus:ring-2 focus:ring-[#8B2500] text-center text-lg mb-4" autocomplete="off">
                <button onclick="checkAnswer()" class="w-full bg-[#8B2500] text-white font-bold py-3 px-4 rounded shadow-md text-lg">呈交答案</button>
            `;
        }

        // 合作題選擇角色
        window.selectRole = function(role) {
            const level = levels[currentLevel];
            const infoBox = document.getElementById('role-info');
            const inputArea = document.getElementById('input-area');
            
            infoBox.innerHTML = level.roles[role];
            infoBox.classList.remove('hidden');
            
            if (role === 'west') {
                inputArea.classList.remove('hidden');
            } else {
                inputArea.classList.add('hidden');
            }
        };

        // 拍照題處理預覽
        window.handlePhotoUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photo-preview').src = e.target.result;
                    document.getElementById('photo-preview-box').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        };

        // AR 相機處理
        window.openARCamera = async function(type, hintText) {
            document.getElementById('ar-modal').classList.remove('hidden');
            document.getElementById('ar-hint').textContent = "💡 提示：" + hintText;
            
            // 隱藏所有 SVG，只開啟對應的
            document.getElementById('svg-landscape').classList.add('hidden');
            document.getElementById('svg-human').classList.add('hidden');
            if (type === 'ar_landscape') document.getElementById('svg-landscape').classList.remove('hidden');
            if (type === 'ar_human') document.getElementById('svg-human').classList.remove('hidden');

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('ar-video').srcObject = cameraStream;
            } catch (err) {
                showToast("無法取得相機權限！請直接靠智慧猜出答案吧！", false);
            }
        };

        window.closeARCamera = function() {
            document.getElementById('ar-modal').classList.add('hidden');
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }
        };

        // 檢查答案機制
        window.checkAnswer = function() {
            const inputEl = document.getElementById('answer-input');
            if (!inputEl) return;
            const userAnswer = inputEl.value.trim().toLowerCase().replace(/\s+/g, ''); // 移除所有空白
            if (!userAnswer) { showToast("請輸入答案！", false); return; }

            const level = levels[currentLevel];
            let isCorrect = false;
            
            if (Array.isArray(level.answer)) {
                isCorrect = level.answer.some(ans => userAnswer.includes(ans.toLowerCase()));
            } else {
                isCorrect = (userAnswer === level.answer.toLowerCase());
            }

            if (isCorrect) {
                showToast("正確！準備進入下一卷...", true);
                currentLevel++;
                setTimeout(() => {
                    if (currentLevel < levels.length) loadLevel();
                    else showEnding();
                }, 1500);
            } else {
                wrongAttempts++;
                document.getElementById('mistake-counter').textContent = `失誤：${wrongAttempts}`;
                showToast("答案不對喔，再仔細觀察看看！", false);
            }
        };

        function showToast(msg, isSuccess) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg text-white font-bold text-center w-11/12 max-w-sm toast-enter ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('toast-show'), 10);
            setTimeout(() => { toast.classList.remove('toast-show'); setTimeout(() => toast.classList.add('hidden'), 300); }, 2500);
        }

        function showEnding() {
            document.getElementById('puzzle-section').classList.add('hidden');
            document.getElementById('intro-section').classList.add('hidden');
            let score = 100 - (wrongAttempts * 10);
            if (score < 60) score = 60;
            
            let rank = wrongAttempts === 0 ? "【狀元及第】完美無瑕" : wrongAttempts <= 2 ? "【榜眼之才】略有瑕疵" : "【新科秀才】尚須努力";
            document.getElementById('final-rank').textContent = rank;
            document.getElementById('final-score').textContent = `最終得分：${score} 分`;

            const ending = document.getElementById('ending-section');
            ending.classList.remove('hidden');
            setTimeout(() => ending.classList.add('active'), 50);
        }

        // 啟動遊戲
        loadLevel();
    </script>
</body>
</html>
