<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旗山孔廟｜實境解謎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
        
        body { font-family: 'Noto Serif TC', serif; background-color: #F4EAD5; color: #3E2723; overflow-x: hidden; }
        
        .decoration-img { mix-blend-mode: multiply; animation: float 6s ease-in-out infinite; }
        .decoration-img-delayed { mix-blend-mode: multiply; animation: float 6s ease-in-out infinite; animation-delay: 3s; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.3s ease-in-out; }

        .card-reveal { animation: popGlow 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popGlow {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .hunt-item-uploaded { border-color: #16A34A !important; }
        .hunt-btn-uploaded { background-color: #16A34A !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div class="fixed left-0 top-1/4 -translate-y-1/2 opacity-15 md:opacity-100 md:left-10 pointer-events-none">
        <img src="boy.jpg" alt="裝飾" class="w-40 md:w-56 lg:w-72 decoration-img" onerror="this.style.display='none'">
    </div>
    <div class="fixed right-0 top-2/3 -translate-y-1/2 opacity-15 md:opacity-100 md:right-10 pointer-events-none">
        <img src="temple.jpg" alt="裝飾" class="w-40 md:w-56 lg:w-72 decoration-img-delayed" onerror="this.style.display='none'">
    </div>

    <!-- 主遊戲容器 -->
    <div id="game-container" class="relative z-10 w-full max-w-md bg-[#FAF3E0] rounded-xl shadow-2xl overflow-hidden border-2 border-[#8B2500]">
        <div class="h-3 w-full bg-[#8B2500]"></div>
        <div class="p-6 md:p-8">
            
            <div class="text-center mb-6">
                <div class="w-16 h-16 mx-auto mb-2 border-2 border-[#8B2500] rounded-full flex items-center justify-center text-3xl text-[#8B2500] font-black shadow-inner">孔</div>
                <h1 class="text-2xl font-black text-[#8B2500] tracking-widest">旗山孔廟</h1>
                <p class="text-xs font-bold text-gray-600 tracking-widest mt-1">新科弟子試煉</p>
            </div>

            <!-- 開場引言區與小隊報到 -->
            <div id="intro-section" class="mb-2 text-gray-700 leading-relaxed bg-[#F4EAD5] p-5 rounded-lg border-2 border-[#D7CCC8] shadow-sm text-center fade-in">
                <h3 class="text-xl font-bold text-[#8B2500] mb-3">【新科弟子報到】</h3>
                <p class="text-sm text-left mb-4 font-bold text-gray-600">老夫子：「年輕人，試煉前請先留下你們的小隊名號與合照，這將是你們最後結算成績的印記。」</p>
                
                <input type="text" id="team-name-input" placeholder="請輸入小隊名稱 (例: 聰明隊)" class="w-full px-4 py-3 rounded bg-white border border-gray-300 focus:outline-none focus:border-[#8B2500] focus:ring-0 text-center text-base font-bold mb-3" autocomplete="off">
                
                <label class="block w-full bg-[#D7CCC8] hover:bg-[#BCAAA4] text-[#3E2723] text-center py-3 rounded cursor-pointer shadow-sm font-bold mb-4 transition-colors">
                    📷 拍下小隊合照
                    <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleTeamPhotoPreload(event)">
                </label>
                <img id="team-photo-preview-intro" class="hidden w-full h-32 object-cover rounded border-2 border-[#8B2500] mb-5">

                <div class="border-t-2 border-[#D7CCC8] pt-4 mt-2">
                    <p class="text-sm font-black text-[#8B2500] mb-3 tracking-widest">👇 請選擇挑戰難度 👇</p>
                    <div class="flex flex-col gap-3">
                        <button onclick="startGame('child')" class="w-full bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md text-lg active:bg-green-800 transition-colors tracking-widest flex items-center justify-center gap-2">
                            🟢 童蒙探索版 <span class="text-xs font-normal bg-white/20 px-2 py-1 rounded">國小以下/親子</span>
                        </button>
                        <button onclick="startGame('teen')" class="w-full bg-[#8B2500] text-white font-bold py-3 px-4 rounded-lg shadow-md text-lg active:bg-[#6A1B00] transition-colors tracking-widest flex items-center justify-center gap-2">
                            🔴 新科弟子版 <span class="text-xs font-normal bg-white/20 px-2 py-1 rounded">國中以上/解謎</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 解謎區塊 -->
            <div id="puzzle-section" class="hidden fade-in">
                
                <div class="mb-3 flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <button onclick="toggleMap()" class="bg-[#8B2500] hover:bg-[#6A1B00] text-white text-xs font-bold py-1.5 px-3 rounded shadow-sm active:scale-95 transition-transform flex items-center gap-1 tracking-widest">
                            🗺️ 開啟闖關地圖
                        </button>
                    </div>
                    <div id="level-nav" class="flex overflow-x-auto scrollbar-hide gap-2 pb-2"></div>
                </div>

                <div class="flex justify-between items-center text-sm font-bold text-[#8B2500] mb-2 tracking-widest">
                    <span id="level-indicator">卷 1</span>
                    <button onclick="useHint()" id="hint-btn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xs font-bold py-1 px-3 rounded-full shadow-sm active:scale-95 transition-transform">
                        💡 錦囊 (<span id="hint-count-display">5</span>)
                    </button>
                </div>
                
                <div class="bg-white rounded-lg p-5 shadow-sm border border-[#E7DCC8] mb-4" id="level-content"></div>
            </div>

            <!-- 結局區塊 -->
            <div id="ending-section" class="hidden">
                <div class="text-center mb-3 fade-in">
                    <h2 class="text-2xl font-black text-[#8B2500]">試煉完成</h2>
                    <p class="text-sm text-gray-700 mt-1 font-bold">老夫子已為你們頒發新科弟子專屬成就卡！</p>
                    <p class="text-sm text-gray-700 mt-1 font-bold">左右切換喜歡的樣式，並長按保存！</p>
                </div>
                
                <div class="flex justify-between items-center mb-3">
                    <button onclick="changeCardStyle(-1)" class="w-10 h-10 bg-[#8B2500] text-white rounded-full font-bold shadow-md active:scale-95 flex items-center justify-center">◀</button>
                    <span id="card-title-indicator" class="font-bold text-[#8B2500] text-sm tracking-widest">1/4 古風御賜卡</span>
                    <button onclick="changeCardStyle(1)" class="w-10 h-10 bg-[#8B2500] text-white rounded-full font-bold shadow-md active:scale-95 flex items-center justify-center">▶</button>
                </div>

                <div class="relative w-full rounded-xl mb-4 card-reveal text-center">
                    <p class="text-sm font-bold text-red-600 mb-2 animate-pulse">👇 請長按下方圖片儲存至手機 👇</p>
                    <canvas id="achievement-canvas" width="800" height="1000" class="hidden"></canvas>
                    <img id="achievement-img" class="w-full h-auto rounded-lg border-4 border-[#8B2500] shadow-xl">
                </div>

                <div id="ending-hunt-btn-area" class="hidden mb-3">
                    <button onclick="toggleHuntModal()" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-4 rounded-lg shadow-md text-base active:scale-95 transition-transform tracking-widest flex items-center justify-center gap-2">
                        📸 查看 / 長按保存尋寶全紀錄
                    </button>
                </div>

                <div class="flex gap-2">
                    <button onclick="location.reload()" class="w-full border-2 border-[#8B2500] bg-[#FAF3E0] text-[#8B2500] font-bold py-3 px-4 rounded-lg tracking-widest text-base active:bg-orange-100">
                        回到首頁
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 闖關地圖彈出視窗 -->
    <div id="map-modal" class="fixed inset-0 z-50 bg-black/85 hidden flex-col items-center justify-center p-4 fade-in">
        <div class="relative w-full max-w-lg bg-[#FAF3E0] rounded-xl p-3 border-4 border-[#8B2500] flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-2 px-2">
                <h3 class="font-bold text-[#8B2500] text-xl tracking-widest">🗺️ 孔廟闖關地圖</h3>
                <button onclick="toggleMap()" class="text-[#8B2500] hover:text-red-600 font-black text-3xl leading-none px-2">&times;</button>
            </div>
            <div class="overflow-auto flex-1 border-2 border-[#D7CCC8] rounded relative bg-white flex items-center justify-center">
                <img src="闖關地圖.png" alt="孔廟全景平面圖" class="w-full h-auto object-contain" onerror="this.alt='無法載入地圖，請確認 闖關地圖.png 檔案是否存在'">
            </div>
            <button onclick="toggleMap()" class="mt-3 w-full bg-[#1B5E20] text-white font-bold py-3 rounded-lg shadow-md active:scale-95 transition-transform tracking-widest text-lg">
                返回解謎
            </button>
        </div>
    </div>

    <!-- 尋寶紀錄下載視窗 -->
    <div id="hunt-modal" class="fixed inset-0 z-50 bg-black/85 hidden flex-col items-center justify-center p-4 fade-in">
        <div class="relative w-full max-w-md bg-[#FAF3E0] rounded-xl p-3 border-4 border-[#8B2500] flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-2 px-2">
                <h3 class="font-bold text-[#8B2500] text-xl tracking-widest">📸 尋寶全紀錄</h3>
                <button onclick="closeHuntModalAndContinue()" class="text-[#8B2500] hover:text-red-600 font-black text-3xl leading-none px-2">&times;</button>
            </div>
            <div class="overflow-auto flex-1 rounded relative flex flex-col items-center justify-center pb-2">
                <p class="text-sm font-bold text-red-600 absolute top-2 w-full text-center animate-pulse z-10 bg-white/80 py-1">👇 請長按下方圖片儲存至手機 👇</p>
                <canvas id="hunt-canvas" width="800" height="1000" class="hidden"></canvas>
                <img id="hunt-img" class="w-full h-auto rounded-lg border-2 border-[#8B2500] shadow-sm mt-8">
                
                <!-- 新增：各別原圖下載按鈕區 -->
                <div id="hunt-original-downloads" class="w-full mt-4 flex flex-wrap justify-center gap-2 hidden">
                    <!-- 動態生成按鈕 -->
                </div>
            </div>
            <div class="flex gap-2 mt-2">
                <button onclick="drawHuntImage('grid')" class="flex-1 bg-yellow-600 text-white font-bold py-2 rounded shadow-md active:scale-95">原圖合輯</button>
                <button onclick="drawHuntImage('frame')" class="flex-1 bg-orange-600 text-white font-bold py-2 rounded shadow-md active:scale-95">相框合輯</button>
            </div>
            <button onclick="closeHuntModalAndContinue()" class="mt-3 w-full bg-[#1B5E20] text-white font-bold py-3 rounded-lg shadow-md active:scale-95 transition-transform tracking-widest text-lg">
                確認完成・前往下一關
            </button>
        </div>
    </div>

    <!-- Web AR 相機視窗 -->
    <div id="ar-modal" class="fixed inset-0 z-50 bg-black hidden flex flex-col">
        <div id="ar-hint" class="w-full bg-black/70 text-white text-center py-3 px-4 z-20 text-sm font-bold text-yellow-400"></div>
        <div class="relative w-full flex-1 overflow-hidden">
            <video id="ar-video" class="w-full h-full object-cover" autoplay playsinline muted></video>
            <svg id="svg-landscape" class="hidden absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
                <rect x="456" y="360" width="88" height="100" fill="none" stroke="#FFEB3B" stroke-width="4" stroke-dasharray="10 10" opacity="0.9"/>
                <text x="500" y="340" fill="#FFEB3B" font-size="20" text-anchor="middle" font-weight="bold">對準中央大門</text>
                <g stroke="#C1395E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
                    <path d="M 196 480 L 276 580 L 356 480" fill="none"/>
                    <line x1="356" y1="480" x2="644" y2="480" />
                    <line x1="356" y1="580" x2="644" y2="580" />
                    <line x1="500" y1="480" x2="500" y2="580" />
                    <line x1="644" y1="480" x2="804" y2="580" />
                </g>
            </svg>
        </div>
        <div class="w-full bg-black/80 p-4 flex justify-between items-center z-20">
            <button onclick="toggleFallbackHint()" class="text-xs text-yellow-400 underline pl-2">鏡頭不支援？點此</button>
            <button onclick="closeARCamera()" class="bg-[#8B2500] text-white px-6 py-3 rounded-full font-bold shadow-lg mr-2">返回作答</button>
        </div>
        <div id="fallback-box" class="hidden absolute inset-4 bg-gray-900/95 text-white p-6 rounded-xl z-30 flex flex-col justify-center items-center text-center">
            <h3 class="text-lg font-bold text-yellow-400 mb-2">AR 輔助提示</h3>
            <p class="text-sm text-gray-300 mb-4 leading-relaxed" id="fallback-text"></p>
            <button onclick="toggleFallbackHint()" class="bg-gray-700 text-white px-4 py-2 rounded text-sm">關閉提示</button>
        </div>
    </div>

        let currentMode = 'teen'; 
        let activeLevels = [];
        let currentLevel = 0;
        let cameraStream = null;
        let teamName = "無名隊";
        let teamPhotoImg = null; 
        let hintsLeft = 5; 
        
        let completedLevels = new Set();
        let revealedHints = new Set();
        let huntPhotoUploaded = false; 

        let currentCardStyle = 0;
        const cardTitles = ["1/4 古風御賜卡", "2/4 Q版貼紙卡", "3/4 拍立得旅行卡", "4/4 孔門弟子卡"];
        const instrumentOptions = ["編鐘", "編磬", "笛", "蕭", "笙", "鳳簫", "拍板", "塤", "甄", "琴", "瑟", "鼗", "敔", "搏拊"];

            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('team-photo-preview-intro').src = e.target.result;
                    document.getElementById('team-photo-preview-intro').classList.remove('hidden');
                    teamPhotoImg = new Image();
                    teamPhotoImg.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function startGame(mode) {
            const nameInput = document.getElementById('team-name-input').value.trim();
            if (nameInput) teamName = nameInput;
            
            currentMode = mode;
            activeLevels = (currentMode === 'child') ? levels_child : levels_teen;
            
            document.getElementById('intro-section').classList.add('hidden');
            document.getElementById('puzzle-section').classList.remove('hidden');
            loadLevel();
        }

        function renderLevelNav() {
            const navContainer = document.getElementById('level-nav');
            let html = '';
            for (let i = 0; i < activeLevels.length; i++) {
                let isCompleted = completedLevels.has(i);
                let isCurrent = (i === currentLevel);
                
                let bgClass = isCurrent ? 'bg-[#8B2500] text-white border-2 border-yellow-400 scale-110' : 
                              (isCompleted ? 'bg-green-600 text-white border-2 border-green-700' : 'bg-gray-200 text-gray-500 border-2 border-transparent');
                
                html += `<button onclick="goToLevel(${i})" class="shrink-0 w-10 h-10 rounded-full font-bold shadow-sm transition-all ${bgClass}">${i + 1}</button>`;
            }
            navContainer.innerHTML = html;
        }

        function goToLevel(idx) {
            currentLevel = idx;
            loadLevel();
        }

            renderLevelNav();

                    });

                } else if (level.type === 'iframe_puzzle') {
                    html += `
                        <div class="w-full mb-5 rounded-lg overflow-hidden border-4 border-[#8B2500] shadow-md bg-gray-100 relative">
                            <iframe src="${level.iframeUrl}" class="w-full h-[50vh] min-h-[400px] md:h-[600px]" frameborder="0" allowfullscreen></iframe>
                        </div>
                        <p class="font-bold text-[#8B2500] text-lg mb-3">${level.question}</p>

                    `;
                } else if (level.type.startsWith('ar_')) {
                    html += `
                        <p class="font-bold text-[#8B2500] text-lg mb-4">${level.question}</p>
                        <button onclick="openARCamera('${level.type}')" class="w-full bg-[#1B5E20] text-white font-bold py-4 px-4 rounded-lg shadow-md mb-4 flex items-center justify-center gap-2 active:scale-95 transition-transform text-lg">
                            <span class="text-2xl">📱</span> 開啟透視鏡
                        </button>
                        ${getInputHTML()}
                    `;

                    html += `
                        <p class="font-bold text-[#8B2500] text-lg mb-4">${level.question}</p>

            let hintStyle = revealedHints.has(currentLevel) ? 'block' : 'hidden';

            if (revealedHints.has(currentLevel) && level.hintImage) {

                    ${hintContent}
                    ${hintImageHtml}
                </div>
            `;

            document.getElementById('level-content').innerHTML = html;
            
            if(level.type === 'photo_hunt' && !completedLevels.has(currentLevel)){
                checkHuntProgress();
            }
        }

        window.useHint = function() {
            if (completedLevels.has(currentLevel)) return; 
            
            const hintBox = document.getElementById('persistent-hint-box');
            const level = activeLevels[currentLevel];

            if (revealedHints.has(currentLevel)) {
                if (hintBox) hintBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            if (hintsLeft > 0) {
                hintsLeft--;
                document.getElementById('hint-count-display').textContent = hintsLeft;
                revealedHints.add(currentLevel);
                
                if (hintBox) {
                    let hintHtml = `💡 錦囊：${level.hint}`;
                    if(level.hintImage) {
                        hintHtml += `<img src="${level.hintImage}" class="w-full mt-3 rounded-lg border-2 border-yellow-400 shadow-sm" onerror="this.style.display='none'">`;
                    }
                    hintBox.innerHTML = hintHtml;
                    hintBox.classList.remove('hidden', 'bg-orange-50', 'text-orange-800', 'border-orange-500');
                    hintBox.classList.add('block', 'bg-yellow-50', 'text-yellow-800', 'border-yellow-500');
                    setTimeout(() => { hintBox.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
                }
            } else {
                if (hintBox) {
                    hintBox.textContent = "💡 錦囊已用完！若需提示，請找到關主並對他說一句稱讚的話！";
                    hintBox.classList.remove('hidden', 'bg-yellow-50', 'text-yellow-800', 'border-yellow-500');
                    hintBox.classList.add('block', 'bg-orange-50', 'text-orange-800', 'border-orange-500');
                    setTimeout(() => { hintBox.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
                }
            }
        };

        // 下載單張原圖
        window.downloadOriginalHuntPhoto = function(index) {
            const img = huntPhotos[index];
            if (!img) return;
            const link = document.createElement('a');
            link.download = `旗山孔廟尋寶_寶物${index + 1}_${teamName}.jpg`;

            link.click();

        window.drawHuntImage = function(style) {
            const canvas = document.getElementById('hunt-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const dlContainer = document.getElementById('hunt-original-downloads');
            
            function drawHuntThumb(img, px, py, pw, ph) {
                if(!img) return;
                const imgRatio = img.width / img.height;
                const boxRatio = pw / ph;
                let srcX = 0, srcY = 0, srcW = img.width, srcH = img.height;
                if (imgRatio > boxRatio) {
                    srcW = img.height * boxRatio;
                    srcX = (img.width - srcW) / 2;
                } else {
                    srcH = img.width / boxRatio;
                    srcY = (img.height - srcH) / 2;
                }
                ctx.drawImage(img, srcX, srcY, srcW, srcH, px, py, pw, ph);
            }

            ctx.fillStyle = '#FAF3E0';
            ctx.fillRect(0, 0, 800, 1000);

            if (style === 'grid') {
                dlContainer.classList.add('hidden'); // 隱藏單圖下載按鈕
                ctx.fillStyle = '#8B2500';
                ctx.textAlign = 'center';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText('📸 孔廟尋寶全紀錄', 400, 100);
                ctx.font = 'bold 30px sans-serif';
                ctx.fillStyle = '#5D4037';
                ctx.fillText(`Team: ${teamName}`, 400, 160);

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(40, 220, 220, 260); drawHuntThumb(huntPhotos[0], 50, 230, 200, 200);
                ctx.fillRect(290, 220, 220, 260); drawHuntThumb(huntPhotos[1], 300, 230, 200, 200);
                ctx.fillRect(540, 220, 220, 260); drawHuntThumb(huntPhotos[2], 550, 230, 200, 200);
                
                ctx.fillRect(165, 520, 220, 260); drawHuntThumb(huntPhotos[3], 175, 530, 200, 200);
                ctx.fillRect(415, 520, 220, 260); drawHuntThumb(huntPhotos[4], 425, 530, 200, 200);

                ctx.strokeStyle = '#D7CCC8'; ctx.lineWidth = 4;
                ctx.strokeRect(20, 20, 760, 960);
                ctx.fillStyle = '#8B2500';
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('MISSION COMPLETE', 400, 880);

            } else if (style === 'frame') {
                // 顯示單張原圖下載按鈕
                dlContainer.innerHTML = '';
                huntPhotos.forEach((img, idx) => {
                    if(img) {
                        const btn = document.createElement('button');
                        btn.className = "bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-3 rounded shadow-sm";
                        btn.innerHTML = `📥 圖 ${idx+1}`;
                        btn.onclick = () => downloadOriginalHuntPhoto(idx);
                        dlContainer.appendChild(btn);
                    }
                });
                dlContainer.classList.remove('hidden');

                ctx.fillStyle = '#3E2723';
                ctx.fillRect(0, 0, 800, 1000);
                ctx.strokeStyle = '#D4AF37'; ctx.lineWidth = 8; ctx.strokeRect(30, 30, 740, 940);
                
                ctx.fillStyle = '#D4AF37';
                ctx.textAlign = 'center';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText('尋 寶 結 業 誌', 400, 110);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(80, 150, 640, 480);
                drawHuntThumb(huntPhotos[4], 90, 160, 620, 460);

                let startX = 80;
                for(let i=0; i<4; i++){
                    ctx.fillRect(startX, 660, 140, 140);
                    drawHuntThumb(huntPhotos[i], startX+5, 665, 130, 130);
                    startX += 166;
                }

                ctx.fillStyle = '#D4AF37';
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText(`【 ${teamName} 】`, 400, 880);
            }

            setTimeout(() => {
                const imgEl = document.getElementById('hunt-img');
                imgEl.src = canvas.toDataURL('image/jpeg', 0.9);
            }, 50);
        }

        window.openARCamera = async function(type) {
            const level = activeLevels[currentLevel];
            document.getElementById('ar-modal').classList.remove('hidden');
            document.getElementById('ar-hint').textContent = "💡 提示：" + level.arHint;
            document.getElementById('fallback-text').innerHTML = level.fallback;
            
            const svgEl = document.getElementById('svg-landscape');
            if (level.type === 'ar_landscape') {

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('ar-video').srcObject = cameraStream;
            } catch (err) {
                showInlineFeedback("無法取得相機權限！請點擊備用提示查看線索。", false);
            }
        };

        window.closeARCamera = function() {
            document.getElementById('ar-modal').classList.add('hidden');
            document.getElementById('svg-landscape').classList.add('hidden');
            if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; }

        window.toggleFallbackHint = function() {

            box.classList.toggle('hidden');
        };

        function showInlineFeedback(msg, isSuccess, duration = 2500) {
            const fb = document.getElementById('inline-feedback');
            if (!fb) return;

            fb.textContent = msg;
            fb.style.opacity = '1';
            
            if (msg.includes("錦囊已用完")) {
                fb.style.color = '#EA580C'; 
            } else if (isSuccess) {
                fb.style.color = '#16A34A'; 
            } else {
                fb.style.color = '#DC2626'; 
            }
            
            const inputEl = document.getElementById('answer-input');
            if (inputEl) {
                if (!isSuccess && !msg.includes("錦囊已用完")) {
                    inputEl.classList.add('animate-shake');
                    inputEl.style.borderColor = '#DC2626';
                    setTimeout(() => {
                        inputEl.classList.remove('animate-shake');
                        inputEl.style.borderColor = '#D1D5DB';
                    }, 400);
                } else if (isSuccess) {
                    inputEl.style.borderColor = '#16A34A';
                }
            }

            if (window.feedbackTimeout) clearTimeout(window.feedbackTimeout);
            window.feedbackTimeout = setTimeout(() => {
                fb.style.opacity = '0';
            }, duration);
        }

        window.checkAnswer = function() {
            const level = activeLevels[currentLevel];
            let isCorrect = false;

            if (level.type === 'audio_match') {
                let allCorrect = true;
                let isAnyEmpty = false;
                for (let i = 0; i < level.answers.length; i++) {
                    const selectEl = document.getElementById(`audio-ans-${i}`);
                    if (!selectEl.value) isAnyEmpty = true;
                    if (selectEl.value !== level.answers[i]) {
                        allCorrect = false;
                    }
                }
                if (isAnyEmpty) {
                    showInlineFeedback("請完成所有聲音的樂器配對！", false);
                    return;
                }
                isCorrect = allCorrect;
            } else if (level.type === 'plaque_fill') {
                let allCorrect = true;
                let isAnyEmpty = false;
                for (let i = 0; i < level.answers.length; i++) {
                    const inputEl = document.getElementById(`plaque-ans-${i}`);
                    let val = inputEl.value.trim().toLowerCase().replace(/\s+/g, '');
                    if (!val) isAnyEmpty = true;
                    if (val !== level.answers[i].toLowerCase()) {
                        allCorrect = false;
                        inputEl.classList.add('border-red-500');
                    } else {
                        inputEl.classList.remove('border-red-500');
                        inputEl.classList.add('border-green-500');
                    }
                }
                if (isAnyEmpty) {
                    showInlineFeedback("請將六個匾額都填寫完整！", false);
                    return;
                }
                isCorrect = allCorrect;
            } else if (level.type === 'two_inputs') {
                const input1 = document.getElementById('answer-input-1');
                const input2 = document.getElementById('answer-input-2');
                if (!input1 || !input2) return;

                const val1 = input1.value.trim().toLowerCase().replace(/\s+/g, '');
                const val2 = input2.value.trim().toLowerCase().replace(/\s+/g, '');

                if (!val1 || !val2) {
                    showInlineFeedback("請將兩位先賢的名字都輸入！", false);
                    return;
                }

                const isCorrect1 = level.answer1.some(ans => val1 === ans.toLowerCase());
                const isCorrect2 = level.answer2.some(ans => val2 === ans.toLowerCase());

                if (isCorrect1 && isCorrect2) {
                    isCorrect = true;
                } else {
                    if (!isCorrect1) {
                        input1.classList.add('border-red-500', 'animate-shake');
                        setTimeout(() => input1.classList.remove('border-red-500', 'animate-shake'), 400);
                    } else {
                        input1.classList.add('border-green-500');
                    }
                    if (!isCorrect2) {
                        input2.classList.add('border-red-500', 'animate-shake');
                        setTimeout(() => input2.classList.remove('border-red-500', 'animate-shake'), 400);
                    } else {
                        input2.classList.add('border-green-500');
                    }
                    isCorrect = false;
                }
            } else if (level.type === 'photo_hunt') {
                let uploadedCount = huntPhotos.filter(img => img !== null).length;
                if (uploadedCount < 5) {
                    showInlineFeedback("必須拍滿 5 個寶物的合照才能過關喔！", false);
                    return;
                }
                isCorrect = true;
            } else {
                const inputEl = document.getElementById('answer-input');
                if (!inputEl) return;
                const userAnswer = inputEl.value.trim().toLowerCase().replace(/\s+/g, ''); 
                if (!userAnswer) { showInlineFeedback("請輸入答案！", false); return; }
                isCorrect = level.answer.some(ans => userAnswer === ans.toLowerCase());
            }

            if (isCorrect) {
                completedLevels.add(currentLevel);
                renderLevelNav(); 
                
                showInlineFeedback("🌟 正確！老夫子：「做得好！」", true, 2000);
                
                if (level.type === 'photo_hunt') {
                    setTimeout(() => {
                        toggleHuntModal();
                    }, 800);
                    return;
                }

                setTimeout(() => {
                    if (completedLevels.size === activeLevels.length) {
                        showEnding();
                    } else {
                        let nextUncompleted = -1;
                        for (let i = 1; i <= activeLevels.length; i++) {
                            let checkIdx = (currentLevel + i) % activeLevels.length;
                            if (!completedLevels.has(checkIdx)) {
                                nextUncompleted = checkIdx;
                                break;
                            }
                        }
                        if (nextUncompleted !== -1) {
                            currentLevel = nextUncompleted;
                            loadLevel();
                        }
                    }
                }, 1500);
            } else {
                showInlineFeedback("答案不對喔，再仔細觀察看看！", false);
            }
        };

        window.changeCardStyle = function(dir) {
            currentCardStyle += dir;
            if (currentCardStyle > 3) currentCardStyle = 0;
            if (currentCardStyle < 0) currentCardStyle = 3;

            document.getElementById('puzzle-section').classList.add('hidden');
            document.getElementById('intro-section').classList.add('hidden');
            
            let rank = "狀元及第";
            
            document.getElementById('ending-section').classList.remove('hidden');
            
            if (currentMode === 'child') {
                const endingHuntBtn = document.getElementById('ending-hunt-btn-area');

        function drawAchievementCard(rank, styleIndex) {
            const canvas = document.getElementById('achievement-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            function drawPhoto(px, py, pw, ph, rotation=0) {
                ctx.save();
                ctx.translate(px + pw/2, py + ph/2);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.translate(-(px + pw/2), -(py + ph/2));

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(px - 10, py - 10, pw + 20, ph + 20);
                
                if(ctx.lineWidth !== 0){
                    ctx.strokeRect(px - 10, py - 10, pw + 20, ph + 20);
                }

                if (teamPhotoImg && teamPhotoImg.src) {
                    const imgRatio = teamPhotoImg.width / teamPhotoImg.height;
                    const boxRatio = pw / ph;
                    let srcX = 0, srcY = 0, srcW = teamPhotoImg.width, srcH = teamPhotoImg.height;
                    if (imgRatio > boxRatio) {
                        srcW = teamPhotoImg.height * boxRatio;
                        srcX = (teamPhotoImg.width - srcW) / 2;
                    } else {
                        srcH = teamPhotoImg.width / boxRatio;
                        srcY = (teamPhotoImg.height - srcH) / 2;
                    }
                    ctx.drawImage(teamPhotoImg, srcX, srcY, srcW, srcH, px, py, pw, ph);
                } else {
                    ctx.fillStyle = '#E7DCC8';
                    ctx.fillRect(px, py, pw, ph);
                    ctx.fillStyle = '#8B2500';
                    ctx.font = '30px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('小隊合照', px + pw/2, py + ph/2 + 10);
                }
                ctx.restore();
            }

            if (styleIndex === 0) {
                ctx.fillStyle = '#8B2500';
                ctx.fillRect(0, 0, 800, 1000);
                ctx.strokeStyle = '#F59E0B'; ctx.lineWidth = 15; ctx.strokeRect(20, 20, 760, 960);
                ctx.strokeStyle = '#FCD34D'; ctx.lineWidth = 4; ctx.strokeRect(40, 40, 720, 920);

                ctx.fillStyle = '#F59E0B';
                ctx.textAlign = 'center';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText('奉天承運・孔廟詔曰', 400, 120);

                ctx.strokeStyle = '#8B2500'; ctx.lineWidth = 4;
                drawPhoto(150, 180, 500, 400);

                ctx.fillStyle = '#FCD34D';
                ctx.font = 'bold 60px sans-serif';
                ctx.fillText(`【${rank}】`, 400, 720);

                ctx.fillStyle = '#F4EAD5';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText(`新科弟子：${teamName}`, 400, 820);

                ctx.save();
                ctx.translate(620, 820);
                ctx.rotate(-0.2);
                ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 8; ctx.strokeRect(-60, -60, 120, 120);
                ctx.fillStyle = '#DC2626'; ctx.font = 'bold 36px sans-serif';
                ctx.fillText('孔廟', 0, -10); ctx.fillText('金榜', 0, 35);
                ctx.restore();

            } else if (styleIndex === 1) {
                ctx.fillStyle = '#FFF9E6';
                ctx.fillRect(0, 0, 800, 1000);
                ctx.strokeStyle = '#FB923C'; ctx.lineWidth = 10; ctx.setLineDash([20, 15]);
                ctx.strokeRect(30, 30, 740, 940);
                ctx.setLineDash([]); 

                ctx.font = '60px sans-serif';
                ctx.fillText('🏮', 100, 150); ctx.fillText('🧧', 700, 200);
                ctx.fillText('🪭', 120, 850); ctx.fillText('📜', 680, 880);

                ctx.fillStyle = '#EA580C';
                ctx.textAlign = 'center';
                ctx.font = 'bold 55px sans-serif';
                ctx.fillText('🌟 孔廟冒險完成 🌟', 400, 140);

                ctx.strokeStyle = '#FDBA74'; ctx.lineWidth = 6;
                drawPhoto(120, 220, 560, 420, 2); 

                ctx.fillStyle = '#EA580C';
                ctx.beginPath();
                ctx.roundRect(150, 720, 500, 90, 45);
                ctx.fill();
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText(`🏆 ${teamName}`, 400, 785);

                ctx.fillStyle = '#4B5563';
                ctx.font = 'bold 45px sans-serif';
                ctx.fillText(`獲得稱號：${rank}`, 400, 880);

            } else if (styleIndex === 2) {
                ctx.fillStyle = '#E5E7EB';
                ctx.fillRect(0, 0, 800, 1000);

                ctx.save();
                ctx.translate(400, 500);
                ctx.rotate(-2 * Math.PI / 180);
                ctx.translate(-400, -500);

                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetX = 10;
                ctx.shadowOffsetY = 10;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(80, 120, 640, 780);
                ctx.shadowColor = 'transparent';

                const px = 120, py = 160, pw = 560, ph = 560;
                ctx.fillStyle = '#000000';
                ctx.fillRect(px, py, pw, ph);
                if (teamPhotoImg && teamPhotoImg.src) {
                    const imgRatio = teamPhotoImg.width / teamPhotoImg.height;
                    const boxRatio = pw / ph;
                    let srcX = 0, srcY = 0, srcW = teamPhotoImg.width, srcH = teamPhotoImg.height;
                    if (imgRatio > boxRatio) {
                        srcW = teamPhotoImg.height * boxRatio;
                        srcX = (teamPhotoImg.width - srcW) / 2;
                    } else {
                        srcH = teamPhotoImg.width / boxRatio;
                        srcY = (teamPhotoImg.height - srcH) / 2;
                    }
                    ctx.drawImage(teamPhotoImg, srcX, srcY, srcW, srcH, px, py, pw, ph);
                } else {
                    ctx.fillStyle = '#E7DCC8';
                    ctx.fillRect(px, py, pw, ph);
                    ctx.fillStyle = '#8B2500';
                    ctx.font = '30px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('小隊合照', px + pw/2, py + ph/2 + 10);
                }

                ctx.fillStyle = '#374151';
                ctx.textAlign = 'center';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText('旗山孔廟之旅 📷', 400, 790);
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText(`Team: ${teamName}`, 400, 850);

                ctx.restore();

                ctx.fillStyle = 'rgba(253, 246, 227, 0.8)';
                ctx.save();
                ctx.translate(400, 100);
                ctx.rotate(-5 * Math.PI / 180);
                ctx.fillRect(-100, -20, 200, 40);
                ctx.restore();

            } else if (styleIndex === 3) {
                ctx.fillStyle = '#1A237E'; 
                ctx.fillRect(0, 0, 800, 1000);
                
                ctx.strokeStyle = '#D4AF37'; ctx.lineWidth = 10; ctx.strokeRect(30, 30, 740, 940);
                ctx.strokeStyle = '#D4AF37'; ctx.lineWidth = 2; ctx.strokeRect(45, 45, 710, 910);

                ctx.fillStyle = '#D4AF37';
                ctx.textAlign = 'center';
                ctx.font = 'bold 60px sans-serif';
                ctx.fillText('孔 廟 書 院', 400, 140);
                ctx.font = 'bold 30px sans-serif';
                ctx.fillText('DISCIPLE IDENTITY CARD', 400, 190);

                ctx.beginPath();
                ctx.moveTo(100, 220); ctx.lineTo(700, 220);
                ctx.lineWidth = 2; ctx.stroke();

                const px = 100, py = 280, pw = 280, ph = 380;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(px-5, py-5, pw+10, ph+10);
                if (teamPhotoImg && teamPhotoImg.src) {
                    const imgRatio = teamPhotoImg.width / teamPhotoImg.height;
                    const boxRatio = pw / ph;
                    let srcX = 0, srcY = 0, srcW = teamPhotoImg.width, srcH = teamPhotoImg.height;
                    if (imgRatio > boxRatio) {
                        srcW = teamPhotoImg.height * boxRatio;
                        srcX = (teamPhotoImg.width - srcW) / 2;
                    } else {
                        srcH = teamPhotoImg.width / boxRatio;
                        srcY = (teamPhotoImg.height - srcH) / 2;
                    }
                    ctx.drawImage(teamPhotoImg, srcX, srcY, srcW, srcH, px, py, pw, ph);
                } else {
                    ctx.fillStyle = '#E7DCC8';
                    ctx.fillRect(px, py, pw, ph);
                }

                ctx.textAlign = 'left';
                ctx.fillStyle = '#D4AF37';
                ctx.font = 'bold 30px sans-serif';
                ctx.fillText('小隊名稱 NAME', 420, 350);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText(teamName, 420, 410);

                ctx.fillStyle = '#D4AF37';
                ctx.font = 'bold 30px sans-serif';
                ctx.fillText('核定階級 RANK', 420, 520);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 50px sans-serif';
                ctx.fillText(rank, 420, 580);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#D4AF37';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('經孔廟管理處核定，特發此證', 400, 850);

                ctx.save();
                ctx.translate(650, 850);
                ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 6; ctx.strokeRect(-50, -50, 100, 100);
                ctx.fillStyle = '#DC2626'; ctx.font = 'bold 30px sans-serif';
                ctx.fillText('孔門', 0, -5); ctx.fillText('認證', 0, 30);
                ctx.restore();
            }

            setTimeout(() => {
                const imgEl = document.getElementById('achievement-img');
                imgEl.src = canvas.toDataURL('image/jpeg', 0.9);
            }, 50);
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.getElementById('puzzle-section').classList.contains('hidden')) {
                const level = activeLevels[currentLevel];
                if (document.activeElement.id === 'touhu-password') {
                    checkTouhuPassword();
                } else if (level.type === 'audio_match' || level.type === 'plaque_fill' || level.type === 'two_inputs' || document.activeElement.id === 'answer-input') {
                    checkAnswer();
                }
            }
        });

    </script>
</body>
</html>
